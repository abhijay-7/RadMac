<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Uploader</title>
    <style>
        #uploadForm {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
        }
        input, button {
            width: 100%;
            padding: 0.5rem;
            font-size: 1rem;
        }
        #status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .progress-container {
            margin-top: 1rem;
            height: 5px;
            background-color: #f0f0f0;
        }
        #progressBar {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
        }
    </style>
</head>
<body>
    <form id="uploadForm">
        <div class="form-group">
            <label for="audioFile">Audio File:</label>
            <input type="file" id="audioFile" name="audio" accept="audio/*" required>
        </div>
        <div class="form-group">
            <label for="artist">Artist Name:</label>
            <input type="text" id="artist" name="artist" required>
        </div>
        <button type="submit">Upload</button>
        <div class="progress-container" id="progressContainer" style="display: none;">
            <div id="progressBar"></div>
        </div>
        <div id="status"></div>
    </form>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('audioFile');
            const artistInput = document.getElementById('artist');
            const statusDiv = document.getElementById('status');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            
            // Reset UI
            statusDiv.textContent = '';
            statusDiv.className = '';
            progressBar.style.width = '0%';
            
            // Validate inputs
            if (!fileInput.files.length) {
                statusDiv.textContent = 'Please select an audio file';
                statusDiv.className = 'error';
                return;
            }
            
            const formData = new FormData();
            formData.append('audio', fileInput.files[0]);
            formData.append('artist', artistInput.value);
            
            try {
                progressContainer.style.display = 'block';
                statusDiv.textContent = 'Starting upload...';
                
                const xhr = new XMLHttpRequest();
                
                xhr.upload.onprogress = (event) => {
                    if (event.lengthComputable) {
                        const percentComplete = (event.loaded / event.total) * 100;
                        progressBar.style.width = `${percentComplete}%`;
                    }
                };
                
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const response = JSON.parse(xhr.responseText);
                        statusDiv.textContent = `Upload successful! File ID: ${response.fileId}`;
                        statusDiv.className = 'success';
                        fileInput.value = '';
                        artistInput.value = '';
                    } else {
                        const error = JSON.parse(xhr.responseText);
                        throw new Error(error.error || 'Upload failed');
                    }
                };
                
                xhr.onerror = () => {
                    throw new Error('Network error during upload');
                };
                
                xhr.open('POST', 'http://localhost:3001/api/upload', true);
                xhr.send(formData);
                
            } catch (error) {
                console.error('Upload error:', error);
                statusDiv.textContent = `Error: ${error.message}`;
                statusDiv.className = 'error';
                progressContainer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
